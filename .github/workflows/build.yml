name: Build Rain & Wind Volume Controls

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rain-wind-volume-controls-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read mod version
        id: version
        shell: pwsh
        run: |
          $source = Get-Content 'src/RainWindVolumeControls.cs' -Raw
          if ($source -notmatch 'PluginVersion\s*=\s*"([^"]+)"') {
            throw 'Could not read PluginVersion from src/RainWindVolumeControls.cs'
          }
          $version = $Matches[1]
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Building Rain & Wind Volume Controls $version"

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore RainWindVolumeControls.csproj --configfile nuget.config

      - name: Build Release DLL
        run: dotnet build RainWindVolumeControls.csproj -c Release --no-restore --nologo

      - name: Prepare versioned artifact
        shell: pwsh
        run: |
          $source = 'bin/Release/RainWindVolumeControls.dll'
          if (!(Test-Path $source)) {
            throw "Expected DLL not found: $source"
          }
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Copy-Item $source "artifacts/Rain & Wind Volume Controls ${{ steps.version.outputs.version }}.dll"

      - name: Upload versioned DLL
        uses: actions/upload-artifact@v4
        with:
          name: RainWindVolumeControls-${{ steps.version.outputs.version }}
          path: artifacts/Rain & Wind Volume Controls ${{ steps.version.outputs.version }}.dll
          if-no-files-found: error
          retention-days: 7
